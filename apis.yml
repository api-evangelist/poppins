name: Poppins
description: >-
  Poppins is a French digital health company that develops a clinically validated digital
  therapeutic (DTx) for children aged 7-11 with dyslexia. Classified as a Class I medical
  device under EU Regulation 2017/745, the mobile application delivers home-based, game-based
  training sessions of about 20 minutes per day, 3-5 times per week, targeting phonological
  awareness, reading speed, and visual attention span. Poppins complements in-person speech
  therapy, supports speech-language pathologists through professional accounts, and partners
  with insurers. The company was surfaced as a Techstars portfolio company and added to the
  API Evangelist network. As of this enrichment pass, Poppins publishes a consumer and
  healthcare-professional web/mobile product but no public developer API, developer portal,
  or machine-readable API surface.
