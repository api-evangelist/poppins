- Commitment for the selected term (3, 6 or 12 months); cancellation only at the end of the term.
- After the commitment, automatic monthly renewal at the same price, cancellable with 48 hours notice before each billing date.
- Application distributed on the French Apple App Store and Google Play stores only.
