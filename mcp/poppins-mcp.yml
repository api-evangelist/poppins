status: unconfirmed
source: >-
  DNS enumeration of poppins.io plus anonymous HTTP probes of the resulting hosts
  (2026-08-17).
summary: >-
  Poppins ships NO confirmed MCP server. A host named mcp.poppins.io does resolve and is
  controlled by Poppins, but it is an AWS API Gateway endpoint that answers HTTP 403
  {"message":"Missing Authentication Token"} on every path and method probed — the response AWS
  returns both for an unmatched route and for a route requiring an API key or IAM signature. It
  is therefore impossible to establish anonymously whether an MCP server exists behind it. NO
  MCPServer pointer is wired into apis.yml and none may be wired until a tools/list handshake
  actually succeeds: an unverified endpoint recorded as an agent surface is worse than no record.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: probed
  note: >-
    mode is `none` because no reachable MCP server was established. The mcp.poppins.io URL is
    deliberately left OUT of `endpoint:` and recorded only under `probe:` below, so it cannot be
    mistaken for a verified agent surface.
